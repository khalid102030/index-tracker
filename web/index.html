<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>راصد بلس · Rasid Plus</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   راصد بلس — Dark Terminal (هوية هادئة مريحة للعين)
   نفس أسماء الأصناف والمتغيرات — تغيير بصري بحت
   ============================================================ */
:root{
  /* رمادي داكن هادئ */
  --bg:#1a1d23; --bg2:#1e2128; --p:#22262e; --p2:#282d36;
  /* حدود رفيعة */
  --ln:rgba(90,169,216,.20); --ln2:rgba(255,255,255,.07);
  /* أزرق مميّز هادئ (بدل السماوي الصارخ) */
  --ac:#5aa9d8; --ac2:#7cc0e6;
  /* حبر */
  --ink:#e4e6ea; --mt:#7a828f;
  /* إشارات مكتومة */
  --g:#4ec9a3; --r:#e07385; --o:#d9a25a;
}
*{margin:0;padding:0;box-sizing:border-box}
*,*::before,*::after{border-radius:0!important}
body{font-family:'IBM Plex Sans Arabic','JetBrains Mono',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.mono,.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:.5px solid var(--ln);background:rgba(26,29,35,.9);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.br{display:flex;align-items:center;gap:11px}
.br .lg{width:38px;height:38px;background:var(--p2);border:.5px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 8px rgba(90,169,216,.28)}
.br .nm{font-weight:700;font-size:1.05rem;letter-spacing:.02em;line-height:1.1}
.br .nm small{display:block;font-family:'JetBrains Mono',monospace;font-size:.56rem;color:var(--ac);font-weight:600;letter-spacing:.38em;margin-top:3px;opacity:.85}
.w{max-width:1000px;margin:0 auto;padding:22px 24px}

.tabs{display:flex;gap:0;background:var(--p);border:.5px solid var(--ln);padding:0;margin-bottom:20px;overflow:hidden}
.tb{flex:1;text-align:center;padding:13px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--mt);border:none;border-inline-start:.5px solid var(--ln2);background:none;font-family:'IBM Plex Sans Arabic',sans-serif;transition:none}
.tb:first-child{border-inline-start:none}
.tb.on{background:var(--p2);color:var(--ac);box-shadow:inset 0 -2px 0 var(--ac)}
.tb:hover:not(.on){color:var(--ink);background:rgba(255,255,255,.02)}

.pn{background:var(--p);border:.5px solid var(--ln2);padding:20px;margin-bottom:14px}
.sh{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sh .d{width:6px;height:6px;background:var(--ac);box-shadow:0 0 9px rgba(90,169,216,.5)}
.sh h2{font-size:1.05rem;font-weight:700;letter-spacing:.01em}
.sh .tg{margin-inline-start:auto;font-size:.62rem;color:var(--mt);background:var(--p);padding:5px 11px;border:.5px solid var(--ln2);font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase}

.bt{background:var(--p2);color:var(--ac);border:.5px solid var(--ac);padding:12px 22px;font-weight:600;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:.92rem;cursor:pointer;transition:background .12s}
.bt:hover:not(:disabled){background:var(--ac-bg,rgba(90,169,216,.12))}
.bt:disabled{opacity:.4;cursor:not-allowed}
.btbig{width:100%;padding:17px;font-size:1.05rem;background:var(--p2);color:var(--o);border-color:var(--o)}
.btbig:hover:not(:disabled){background:rgba(217,162,90,.12)}

.bs{background:var(--p2);border:.5px solid var(--ln2);color:var(--ac);padding:7px 13px;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;transition:border-color .12s}
.bs:hover{border-color:var(--ac)}
.bs.on{background:var(--p2)!important;border-color:var(--ac)!important;color:var(--ac)!important}

input{width:100%;padding:11px 13px;border:.5px solid var(--ln2);background:var(--bg2);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:.9rem;margin-bottom:8px}
input:focus{outline:none;border-color:var(--ac)}
input::placeholder{color:var(--mt);font-family:'IBM Plex Sans Arabic',sans-serif}
select{font-family:'JetBrains Mono',monospace;background:var(--bg2);color:var(--ink);border:.5px solid var(--ln2);padding:9px 12px}

.rc{background:var(--p);border:.5px solid var(--ln2);padding:15px 17px;margin-bottom:10px}
.sb{height:5px;background:var(--bg);overflow:hidden;margin-top:5px;border:.5px solid var(--ln2)}
.sf{height:100%;transition:width .4s linear}

.fade{animation:fd .28s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p2);border:.5px solid var(--ac);color:var(--ac);padding:11px 22px;font-weight:600;z-index:100;font-family:'JetBrains Mono',monospace;letter-spacing:.02em;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.spin{display:inline-block;width:16px;height:16px;border:.5px solid var(--ln2);border-top-color:var(--ac);animation:sp .7s steps(12) infinite;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}

table{-webkit-overflow-scrolling:touch;border-collapse:collapse}
th{font-family:'JetBrains Mono',monospace!important;font-weight:600!important;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
td{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.tblwrap::-webkit-scrollbar{height:5px}.tblwrap::-webkit-scrollbar-thumb{background:var(--ln)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input[type=checkbox]{accent-color:var(--ac)!important}
:focus-visible{outline:1.5px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition:none!important}}

@media(max-width:768px){
  .bar{padding:11px 14px}
  .br .lg{width:34px;height:34px;font-size:16px}.br .nm{font-size:.98rem}.br .nm small{font-size:.5rem;letter-spacing:.3em}
  .w{padding:12px}
  .tabs{margin-bottom:14px;position:sticky;top:58px;z-index:40}
  .tb{padding:12px 6px;font-size:.88rem}
  .pn{padding:14px}
  .sh h2{font-size:1rem}.sh .tg{font-size:.6rem;padding:3px 7px}
  .bt{padding:11px 16px;font-size:.9rem}
  .btbig{padding:15px;font-size:1rem}
  .bs{padding:8px 12px;font-size:.82rem}
  input{padding:11px 12px;font-size:16px}
  table{font-size:.75rem!important}
  table th,table td{padding:7px 4px!important}
  .rc{padding:12px 13px}
  .toast{bottom:16px;font-size:.85rem;padding:9px 18px;max-width:90%;text-align:center}
}
@media(max-width:420px){
  table{font-size:.68rem!important}
  table th,table td{padding:6px 3px!important}
  .sh{flex-wrap:wrap;gap:6px}.sh .tg{margin-inline-start:0;width:100%}
}
</style></head><body><div id="root"></div>
<script>
const S={tab:"analyze",result:null,busy:false,sortMode:"strength"};
function setSort(m){S.sortMode=m;loadLatest()}
async function api(p,o){const r=await fetch(p,o);if(!r.ok){let m="";try{const e=await r.json();m=e.detail||JSON.stringify(e)}catch(_){m=r.statusText}throw new Error(m||"خطأ "+r.status)}return r.json()}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}

function shell(){document.getElementById("root").innerHTML=`
<div class="bar"><div class="br"><div class="lg">📡</div><div class="nm">راصد بلس<small>RASID PLUS</small></div></div><div id="hp" style="font-size:.72rem;color:var(--mt)">…</div></div>
<div class="w"><div class="tabs">
<button class="tb ${S.tab==='analyze'?'on':''}" onclick="go('analyze')">🎯 التحليل</button>
<button class="tb ${S.tab==='settings'?'on':''}" onclick="go('settings')">⚙️ الإعدادات</button>
</div><div id="ct" class="fade">${S.tab==='settings'?pgSettings():pgAnalyze()}</div></div>`;loadH();if(S.tab==='analyze'){loadSync();loadAccuracy();loadLatest();loadLongterm()}if(S.tab==='settings'){loadCfg();loadTg();loadSubs();loadLearning()}}
function go(t){S.tab=t;shell()}
async function loadH(){try{const h=await api("/api/health");const p=document.getElementById("hp");if(!p)return;const ms=h.market_status;const mc=ms==='live'?'var(--g)':ms==='weekend'?'var(--r)':'var(--ac2)';p.innerHTML=`<span style="color:${mc}">${ms==='live'?'🟢 مفتوح':ms==='post_close'?'🔴 مغلق':ms==='pre_open'?'🟡 قبل الافتتاح':'⚪ عطلة'}</span> ${h.time_riyadh||''}`}catch(e){}}

// ═══════ التحليل (زر واحد) ═══════
function pgAnalyze(){return `
<div class="pn" id="syncPanel" style="border:1px solid rgba(0,212,255,.15)">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
<div><span style="font-weight:700;color:var(--ac2)">⏰ السحب التلقائي</span><span id="syncTimes" style="font-size:.72rem;color:var(--mt);margin-right:8px"></span></div>
<div style="display:flex;gap:6px"><button class="bs" onclick="skipNext()" id="skipBtn">⏭️ تخطّي القادم</button><button class="bs" onclick="togglePause()" id="pauseBtn">⏸️ إيقاف مؤقت</button></div>
</div><div id="syncStatus" style="font-size:.78rem;color:var(--mt);margin-top:6px">…</div></div>

<div id="accuracyCard"></div>
<div class="pn" style="text-align:center">
<button class="bt btbig" onclick="runFull()" id="mainBtn">🚀 حلّل الآن — Claude + Gemini</button>
<div style="font-size:.75rem;color:var(--mt);margin-top:8px">يسحب البيانات · يحدّث النتائج السابقة · يقيّم · يطلع أفضل التوصيات</div>
</div>
<div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px;flex-wrap:wrap">
<button class="bs" onclick="updateTracking(this)">💹 تحديث الأسعار</button>
<button class="bs" onclick="resendTg(this)">✈️ إرسال توصيات اليوم لتيليجرام</button>
<button class="bs" onclick="toggleHistory()" id="histBtn">📜 السجل الكامل</button></div>
<div id="analyzeNotes"></div>
<div id="resultBox"></div>
<div id="ltBox"></div>
<div id="trackBox" style="margin-top:8px;display:none"></div>`}
function toggleHistory(){const b=document.getElementById("trackBox");const btn=document.getElementById("histBtn");if(b.style.display==='none'){b.style.display='block';btn.textContent='✖ إخفاء السجل';loadTracking()}else{b.style.display='none';btn.textContent='📜 السجل الكامل'}}

async function loadAccuracy(){const c=document.getElementById("accuracyCard");if(!c)return;try{const d=await api("/api/recommendations/performance");if(d.error||d.total===0||d.total===undefined){c.innerHTML='';return}const rate=d.success_rate||0;const rc=rate>=70?"var(--g)":rate>=50?"var(--ac2)":"var(--r)";const cats=d.by_category||{};const cl={short_term:"قريبة",long_term:"طويلة",speculative:"مضاربة"};
let h=`<div class="pn" style="background:linear-gradient(165deg,var(--p),var(--bg2));border:1px solid ${rate>=50?'rgba(0,230,118,.25)':'rgba(255,82,82,.2)'}">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
<div style="display:flex;align-items:center;gap:14px">
<div style="text-align:center"><div style="font-size:2.2rem;font-weight:900;color:${rc};line-height:1">${rate}%</div><div style="font-size:.68rem;color:var(--mt)">دقة القريبة (+1.5%)</div></div>
<div style="height:44px;width:1px;background:var(--ln2)"></div>
<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem">
<span style="color:var(--g)" title="ناجحة">✅ ${d.success||0}</span>
<span style="color:var(--r)" title="فاشلة">❌ ${d.failed||0}</span>
<span style="color:var(--mt)" title="بلا حركة">⚪ ${d.flat||0}</span>
<span style="color:#5aafff" title="كل الجارية">🔵 ${d.active||0} جارية (الكل)</span>
${d.late_success>0?`<span style="color:var(--ac2)">🔄 ${d.late_success}</span>`:''}</div></div>
<div style="text-align:left;font-size:.72rem;color:var(--mt)">${d.avg_peak?`متوسط الذروة ${d.avg_peak}%`:''}</div></div>`;
// دقة المدى البعيد منفصلة (هدف +5%)
const lt=d.longterm||{};
if(lt.closed>0){const ltc=lt.rate>=50?"var(--g)":"var(--r)";h+=`<div style="display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;background:rgba(156,106,222,.1);border-radius:8px;border:1px solid rgba(156,106,222,.25)"><span style="color:#9c6ade;font-weight:700">🌱 المدى البعيد (+5%):</span> <b style="color:${ltc}">${lt.rate}%</b> <span style="color:var(--mt);font-size:.72rem">(${lt.success}/${lt.closed}) · متوسط الذروة ${lt.avg_peak}%</span></div>`}
// دقة كل فئة
const catRows=Object.entries(cats).filter(([k,v])=>v.total>0&&k!=='long_term');
if(catRows.length){h+=`<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln2)">`;
for(const[k,v]of catRows){const vc=v.rate>=50?"var(--g)":"var(--r)";h+=`<div style="font-size:.78rem"><span style="color:var(--mt)">${cl[k]||k}:</span> <b style="color:${vc}">${v.rate}%</b> <span style="color:var(--mt);font-size:.7rem">(${v.success}/${v.total})</span></div>`}h+=`</div>`}
if(!d.mature)h+=`<div style="font-size:.68rem;color:var(--mt);margin-top:8px">⚠️ العينة ${d.closed}/20 — الدقة تتحسّن مع تراكم النتائج</div>`;
h+=`</div>`;c.innerHTML=h}catch(e){c.innerHTML=''}}
async function toggleLongterm(){try{const r=await api("/api/longterm/toggle",{method:"POST"});toast(r.enabled?"🟢 التوصيات البعيدة مفعّلة":"🔴 التوصيات البعيدة موقوفة");loadLongterm()}catch(e){toast("❌ "+e.message)}}
async function loadLongterm(){const box=document.getElementById("ltBox");if(!box)return;try{let ltOn=true;try{const st=await api("/api/longterm/status");ltOn=st.enabled}catch(e){}
const d=await api("/api/recommendations/longterm");const picks=d.picks||[];
let h=`<div class="sh"><div class="d" style="background:#9c6ade;box-shadow:0 0 14px #9c6ade"></div><h2>🌱 أسهم المدى البعيد النوعية</h2><span class="tg">${picks.length} · أسبوعي/شهري · منتقاة</span><button class="bs${ltOn?' on':''}" style="margin-inline-start:auto" onclick="toggleLongterm()">${ltOn?'🟢 مفعّلة':'🔴 موقوفة'}</button></div>`;
if(!ltOn){h+=`<div class="pn" style="text-align:center;color:var(--mt);padding:16px;border:1px dashed rgba(156,106,222,.3)">التوصيات البعيدة موقوفة — فعّلها لتتبعها</div>`;box.innerHTML=h;return}
h+=`<div style="font-size:.75rem;color:var(--mt);margin-bottom:8px">أسهم قوية على المدى الطويل، لم ترتفع كثيراً مؤخراً — فرص تجميع بعيدة المدى. محدودة ونادرة (تشكّلها بطيء).</div>`;
if(!picks.length){h+=`<div class="pn" style="text-align:center;color:var(--mt);padding:20px;border:1px dashed rgba(156,106,222,.3)">لا توجد أسهم مدى بعيد نوعية حالياً — المعايير صارمة (إشارات طويلة قوية + لم ترتفع كثيراً + ليست فخاً). قد تظهر عند تشكّل الفرص.</div>`;box.innerHTML=h;return}
for(const p of picks){const cc=p.bet_score>=50?"var(--g)":"var(--ac2)";const wc=p.weekly_change>0?"var(--g)":p.weekly_change<0?"var(--r)":"var(--mt)";
h+=`<div class="rc" style="border-color:rgba(156,106,222,.3)">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center">
<div><b style="font-size:1.05rem">${p.name||''}</b> <span style="font-family:'IBM Plex Mono';color:var(--mt);font-size:.8rem">${p.symbol}</span></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span style="font-family:'IBM Plex Mono';font-weight:700">${p.price||''}</span>
<span style="font-size:.75rem;color:var(--mt)">إشارات طويلة ${p.long_pct}%</span>
<span style="background:${cc}22;color:${cc};padding:2px 8px;border-radius:6px;font-weight:700;font-size:.78rem">${(p.bet_score||0).toFixed(0)}</span></div></div>
<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.75rem">
<span style="color:${wc}">أسبوعي ${p.weekly_change>0?'+':''}${p.weekly_change}%</span>
<span style="color:var(--mt)">شهري ${p.monthly_change>0?'+':''}${p.monthly_change}%</span>
<span style="color:var(--ac2)">RSI ${(p.rsi||0).toFixed(0)} · ${p.rsi_state||''}</span>
${p.signals?.length?`<span style="color:var(--g)">🔑 ${p.signals.join(' · ')}</span>`:''}</div></div>`}
box.innerHTML=h}catch(e){box.innerHTML=''}}
async function loadLatest(){const box=document.getElementById("resultBox");if(!box)return;try{const d=await api("/api/recommendations/latest");let picks=d.picks||[];if(!picks.length){box.innerHTML='';return}
// الترتيب حسب اختيار المستخدم
if(S.sortMode==='newest'){picks=picks.slice().sort((a,b)=>(b.created_at||b.appeared_date||'').localeCompare(a.created_at||a.appeared_date||''))}
else if(S.sortMode==='oldest'){picks=picks.slice().sort((a,b)=>(a.created_at||a.appeared_date||'').localeCompare(b.created_at||b.appeared_date||''))}
else if(S.sortMode==='gain'){picks=picks.slice().sort((a,b)=>(b.current_pct||0)-(a.current_pct||0))}
else{picks=picks.slice().sort((a,b)=>(b.confidence||0)-(a.confidence||0))}
const byStrength=(!S.sortMode||S.sortMode==='strength');
let h=`<div class="sh"><div class="d" style="background:var(--o);box-shadow:0 0 14px var(--o)"></div><h2>🎯 التوصيات النشطة</h2><span class="tg">${picks.length} سهم تحت المتابعة</span></div>`;
h+=`<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center"><button class="bs${byStrength?' on':''}" onclick="setSort('strength')">💪 الأقوى</button><button class="bs${S.sortMode==='newest'?' on':''}" onclick="setSort('newest')">🕐 الأحدث</button><button class="bs${S.sortMode==='oldest'?' on':''}" onclick="setSort('oldest')">📅 الأقدم</button><button class="bs${S.sortMode==='gain'?' on':''}" onclick="setSort('gain')">📈 الأداء</button></div>`;
h+=`<div style="font-size:.68rem;color:var(--mt);margin-bottom:8px;background:var(--bg2);padding:7px 12px;border-radius:8px">${byStrength?'🥇🥈🥉 = أقوى 3 حسب الثقة · ':''}اضغط أي سهم لعرض سبب الترشيح · النسبة = الفرق عن الدخول</div>`;
h+=`<div class="pn" style="padding:0;overflow:hidden"><div class="tblwrap"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
<thead><tr style="background:var(--bg);color:var(--ac2);font-size:.72rem"><th style="padding:9px 6px">#</th><th style="padding:9px 6px;text-align:right">السهم</th><th style="padding:9px 6px">الثقة</th><th style="padding:9px 6px">الظهور</th><th style="padding:9px 6px">الدخول</th><th style="padding:9px 6px">الحالي</th><th style="padding:9px 6px">النسبة</th><th style="padding:9px 6px">أعلى</th><th style="padding:9px 6px">الهدف</th><th style="padding:9px 6px">متبقّي</th></tr></thead><tbody>`;
let rank=0;for(const p of picks){rank++;const cc=p.confidence>=9?"var(--g)":p.confidence>=8?"var(--ac2)":"var(--mt)";const cp=p.current_pct||0;const cpc=cp>0?"var(--g)":cp<0?"var(--r)":"var(--mt)";const medal=byStrength?(rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':`${rank}`):`${rank}`;
const appDate=p.created_at?p.created_at.slice(0,16).replace('T',' '):(p.appeared_date||'-');const appShort=p.appeared_date||(p.created_at?p.created_at.slice(0,10):'-');
let remTxt='-',remColor='var(--mt)';const exp=p.max_expiry_date||p.expiry_date;if(exp){const today=new Date();today.setHours(0,0,0,0);const ed=new Date(exp);const diff=Math.ceil((ed-today)/(1000*60*60*24));if(diff>1){remTxt=`${diff} أيام`;remColor='var(--g)'}else if(diff===1){remTxt='يوم واحد';remColor='var(--o)'}else if(diff===0){remTxt='ينتهي اليوم';remColor='var(--o)'}else{remTxt='منتهية';remColor='var(--r)'}}

async function loadLearning(btn){const box=document.getElementById("learnBox");if(!box)return;if(btn&&btn.innerHTML){const o=btn.innerHTML;btn.innerHTML='<span class="spin"></span>';setTimeout(()=>{btn.innerHTML=o},800)}try{const d=await api("/api/learning/status");let h='';

box.innerHTML=h}catch(e){box.innerHTML=`<span style="color:var(--mt)">التعلّم غير متاح بعد (يحتاج نتائج محسومة)</span>`}}

async function showCriteria(){const m=document.getElementById("cm");m.innerHTML='<span class="spin"></span> جاري جلب المعايير...';try{const c=await api("/api/strategy/criteria");let perf={};try{perf=await api("/api/recommendations/analysis")}catch(e){}

h+=`<div style="font-weight:700;margin:6px 0">⚙️ الأساسية:</div>`;
h+=`<div>الهدف +${c.core.target_pct}% · صلاحية ${c.core.validity_days} أيام · أقصى ${c.core.max_days} · متابعة ${c.core.post_watch_days} يوم</div>`;
h+=`<div style="font-weight:700;margin:10px 0 4px">🎯 المكافآت (الوزن · الأداء):</div>`;
for(const b of c.bonuses){const r=sigRates[b.signal];const rt=r?` · <span style="color:${r.rate>=60?'var(--g)':r.rate>=40?'var(--ac2)':'var(--r)'}">${r.rate}% (${r.count})</span>`:'';h+=`<div>• ${b.signal}: <b style="color:var(--g)">+${b.weight}</b>${rt}</div>`}
h+=`<div style="font-weight:700;margin:10px 0 4px">🚫 العقوبات:</div>`;
for(const p of c.penalties){h+=`<div>• ${p.penalty}: <b style="color:var(--r)">${p.weight}</b></div>`}
h+=`<div style="font-weight:700;margin:10px 0 4px">📊 طبقة RSI (الوزن · الأداء):</div>`;
for(const s of c.rsi_layer){const r=rsiRates[s.state];const rt=r?` · <span style="color:${r.rate>=60?'var(--g)':r.rate>=40?'var(--ac2)':'var(--r)'}">${r.rate}% (${r.count})</span>`:'';const wc=s.weight>0?"var(--g)":"var(--r)";h+=`<div>• ${s.state} <span style="color:var(--mt);font-size:.68rem">(${s.condition})</span>: <b style="color:${wc}">${s.weight>0?'+':''}${s.weight}</b>${rt}</div>`}
h+=`<div style="font-weight:700;margin:10px 0 4px">📅 الأطر الزمنية:</div>`;
for(const t of c.timeframe){const wc=t.weight>0?"var(--g)":"var(--r)";h+=`<div>• ${t.range}: <b style="color:${wc}">${t.weight>0?'+':''}${t.weight}</b>${t.measured_rate?` <span style="color:var(--ac2)">(${t.measured_rate})</span>`:''}</div>`}
h+=`<div style="font-weight:700;margin:10px 0 4px">🚪 حدود القرار:</div>`;

h+=`</div>`;m.innerHTML=h}catch(e){m.innerHTML=`<span style="color:var(--r)">❌ ${e.message}</span>`}}
async function showAnalysis(){const m=document.getElementById("cm");m.innerHTML='<span class="spin"></span> جاري تحليل المؤشرات...';try{const d=await api("/api/recommendations/analysis");if(d.closed_total===0){m.innerHTML='<span style="color:var(--mt)">لا نتائج محسومة بعد للتحليل</span>';return}

const si=d.avg_indicators?.success||{},fi=d.avg_indicators?.failed||{};
h+=`<div style="font-weight:700;margin:10px 0 4px">📈 متوسط المؤشرات (ناجحة مقابل فاشلة):</div>`;
const lbls={rsi:"RSI",weekly_change:"أسبوعي",monthly_change:"شهري",net_liquidity:"سيولة",pre_launch:"قوة الانطلاق",total_active:"عدد النشطة"};
for(const k in lbls){if(si[k]!=null||fi[k]!=null)h+=`<div>• ${lbls[k]}: ناجحة <b style="color:var(--g)">${si[k]??'-'}</b> · فاشلة <b style="color:var(--r)">${fi[k]??'-'}</b></div>`}
h+=`</div>`;m.innerHTML=h}catch(e){m.innerHTML=`<span style="color:var(--r)">❌ ${e.message}</span>`}}

// ═══ تحديث تلقائي بعد كل توقيت سحب مجدول ═══
// يقرأ الأوقات من الإعدادات (متغيّرة)، ويحدّث مرة بعد كل توقيت بـ 3 دقائق
let _refreshedSlots={};
async function _autoRefreshCheck(){
  try{
    if(S.tab!=='analyze')return;
    const d=await api("/api/sync/status");
    if(d.paused)return;
    const times=d.schedule||[];
    const now=new Date();
    const nowMin=now.getHours()*60+now.getMinutes();
    const key=now.toISOString().slice(0,10);// اليوم
    for(const t of times){
      const [hh,mm]=t.split(':').map(Number);
      const slotMin=hh*60+mm+3;// بعد التوقيت بـ 3 دقائق (وقت انتهاء التحليل)
      const slotKey=`${key}_${t}`;
      // إذا مرّت 3 دقائق على التوقيت ولم نحدّث بعده اليوم
      if(nowMin>=slotMin && nowMin<slotMin+5 && !_refreshedSlots[slotKey]){
        _refreshedSlots[slotKey]=true;
        toast(`🔄 تحديث تلقائي بعد سحب ${t}`);
        loadAccuracy();loadLatest();loadLongterm();loadSync();
      }
    }
    // تنظيف مفاتيح الأمس
    for(const k in _refreshedSlots){if(!k.startsWith(key))delete _refreshedSlots[k]}
  }catch(e){}
}
setInterval(_autoRefreshCheck,60000);// فحص كل دقيقة

shell();
</script></body></html>
