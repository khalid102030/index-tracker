<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>راصد بلس · Rasid Plus</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1628;--bg2:#0f1f38;--p:#132744;--p2:#183050;--ln:rgba(0,212,255,.18);--ln2:rgba(255,255,255,.07);--ac:#00d4ff;--ac2:#4dd0e1;--ink:#e8ecf0;--mt:#7a8fa3;--g:#00e676;--r:#ff5252;--o:#ff9800}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal',sans-serif;background:radial-gradient(140% 100% at 90% -10%,rgba(0,212,255,.08),transparent),linear-gradient(170deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--ln);background:rgba(10,22,40,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.br{display:flex;align-items:center;gap:10px}.br .lg{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#0077b6);display:flex;align-items:center;justify-content:center;font-size:20px}.br .nm{font-weight:900;font-size:1.15rem}.br .nm small{display:block;font-size:.58rem;color:var(--ac2);font-weight:700;letter-spacing:3px}
.w{max-width:1000px;margin:0 auto;padding:22px 24px}
.tabs{display:flex;gap:5px;background:var(--p);border:1px solid var(--ln2);border-radius:14px;padding:5px;margin-bottom:20px}.tb{flex:1;text-align:center;padding:11px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.95rem;color:var(--mt);border:none;background:none;font-family:'Tajawal';transition:.15s}.tb.on{background:linear-gradient(135deg,var(--p2),#132744);color:var(--ac2);border:1px solid var(--ln)}.tb:hover:not(.on){color:var(--ink)}
.pn{background:var(--p);border:1px solid var(--ln2);border-radius:15px;padding:20px;margin-bottom:14px}
.sh{display:flex;align-items:center;gap:9px;margin:20px 0 12px}.sh .d{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}.sh h2{font-size:1.15rem;font-weight:800}.sh .tg{margin-right:auto;font-size:.7rem;color:var(--mt);background:var(--p);padding:4px 10px;border-radius:99px;border:1px solid var(--ln2)}
.bt{background:linear-gradient(135deg,var(--ac),#0077b6);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-weight:800;font-family:'Tajawal';font-size:.95rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,212,255,.2)}.bt:hover{transform:translateY(-1px)}.bt:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btbig{width:100%;padding:18px;font-size:1.1rem;background:linear-gradient(135deg,var(--o),#e65100);box-shadow:0 6px 20px rgba(255,152,0,.3)}
.bs{background:var(--bg2);border:1px solid var(--ln2);color:var(--ac2);border-radius:8px;padding:6px 12px;font-family:'Tajawal';font-weight:700;font-size:.8rem;cursor:pointer}.bs:hover{border-color:var(--ac)}.bs.on{background:var(--p2)!important;border-color:var(--ln)!important}
input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--ln2);background:var(--bg2);color:var(--ink);font-family:'Tajawal';font-size:.88rem;margin-bottom:8px}input:focus{outline:none;border-color:var(--ac)}
.rc{background:linear-gradient(165deg,var(--p),var(--bg2));border:1px solid var(--ln2);border-radius:13px;padding:15px 17px;margin-bottom:10px}
.sb{height:5px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:4px}.sf{height:100%;border-radius:99px;transition:width .5s}
.fade{animation:fd .3s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);color:var(--ac2);padding:10px 22px;border-radius:11px;font-weight:700;z-index:100}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--ln2);border-top-color:var(--ac);border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:768px){.w{padding:14px}}
</style></head><body><div id="root"></div>
<script>
const S={tab:"analyze",result:null,busy:false};
async function api(p,o){const r=await fetch(p,o);if(!r.ok){let m="";try{const e=await r.json();m=e.detail||JSON.stringify(e)}catch(_){m=r.statusText}throw new Error(m||"خطأ "+r.status)}return r.json()}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}

function shell(){document.getElementById("root").innerHTML=`
<div class="bar"><div class="br"><div class="lg">📡</div><div class="nm">راصد بلس<small>RASID PLUS</small></div></div><div id="hp" style="font-size:.72rem;color:var(--mt)">…</div></div>
<div class="w"><div class="tabs">
<button class="tb ${S.tab==='analyze'?'on':''}" onclick="go('analyze')">🎯 التحليل</button>
<button class="tb ${S.tab==='settings'?'on':''}" onclick="go('settings')">⚙️ الإعدادات</button>
</div><div id="ct" class="fade">${S.tab==='settings'?pgSettings():pgAnalyze()}</div></div>`;loadH();if(S.tab==='analyze'){loadSync();loadAccuracy();if(!S.result)loadLatest();loadLongterm()}if(S.tab==='settings')loadCfg()}
function go(t){S.tab=t;shell()}
async function loadH(){try{const h=await api("/api/health");const p=document.getElementById("hp");if(!p)return;const ms=h.market_status;const mc=ms==='live'?'var(--g)':ms==='weekend'?'var(--r)':'var(--ac2)';p.innerHTML=`<span style="color:${mc}">${ms==='live'?'🟢 مفتوح':ms==='post_close'?'🔴 مغلق':ms==='pre_open'?'🟡 قبل الافتتاح':'⚪ عطلة'}</span> ${h.time_riyadh||''}`}catch(e){}}

// ═══════ التحليل (زر واحد) ═══════
function pgAnalyze(){return `
<div class="pn" id="syncPanel" style="border:1px solid rgba(0,212,255,.15)">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
<div><span style="font-weight:700;color:var(--ac2)">⏰ السحب التلقائي</span><span id="syncTimes" style="font-size:.72rem;color:var(--mt);margin-right:8px"></span></div>
<div style="display:flex;gap:6px"><button class="bs" onclick="togglePause()" id="pauseBtn">⏸️ إيقاف مؤقت</button></div>
</div><div id="syncStatus" style="font-size:.78rem;color:var(--mt);margin-top:6px">…</div></div>

<div id="accuracyCard"></div>
<div class="pn" style="text-align:center">
<button class="bt btbig" onclick="runFull()" id="mainBtn">🚀 حلّل الآن — Claude + Gemini</button>
<div style="font-size:.75rem;color:var(--mt);margin-top:8px">يسحب البيانات · يحدّث النتائج السابقة · يقيّم · يطلع 3–5 توصيات</div>
</div>
<div class="pn" style="border:1px solid rgba(0,230,118,.15)">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
<span style="font-weight:700;color:var(--g)">📈 تتبع التوصيات</span>
<div style="display:flex;gap:6px"><button class="bs" onclick="loadTracking()">🔄 عرض التتبع</button><button class="bs" onclick="updateTracking()">💹 تحديث الأسعار</button></div>
</div><div id="trackBox" style="margin-top:8px"></div></div>
<div id="resultBox">${S.result?renderResult():''}</div>
<div id="ltBox"></div>`}

async function loadAccuracy(){const c=document.getElementById("accuracyCard");if(!c)return;try{const d=await api("/api/recommendations/performance");if(d.error||d.total===0||d.total===undefined){c.innerHTML='';return}const rate=d.success_rate||0;const rc=rate>=70?"var(--g)":rate>=50?"var(--ac2)":"var(--r)";const cats=d.by_category||{};const cl={short_term:"قريبة",long_term:"طويلة",speculative:"مضاربة"};
let h=`<div class="pn" style="background:linear-gradient(165deg,var(--p),var(--bg2));border:1px solid ${rate>=50?'rgba(0,230,118,.25)':'rgba(255,82,82,.2)'}">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
<div style="display:flex;align-items:center;gap:14px">
<div style="text-align:center"><div style="font-size:2.2rem;font-weight:900;color:${rc};line-height:1">${rate}%</div><div style="font-size:.68rem;color:var(--mt)">دقة التوصيات</div></div>
<div style="height:44px;width:1px;background:var(--ln2)"></div>
<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem">
<span style="color:var(--g)" title="ناجحة">✅ ${d.success||0}</span>
<span style="color:var(--r)" title="فاشلة">❌ ${d.failed||0}</span>
<span style="color:var(--mt)" title="بلا حركة">⚪ ${d.flat||0}</span>
<span style="color:#5aafff" title="كل الجارية">🔵 ${d.active||0} جارية (الكل)</span>
${d.late_success>0?`<span style="color:var(--ac2)">🔄 ${d.late_success}</span>`:''}</div></div>
<div style="text-align:left;font-size:.72rem;color:var(--mt)">${d.avg_peak?`متوسط الذروة ${d.avg_peak}%`:''}</div></div>`;
// دقة كل فئة
const catRows=Object.entries(cats).filter(([k,v])=>v.total>0);
if(catRows.length){h+=`<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln2)">`;
for(const[k,v]of catRows){const vc=v.rate>=50?"var(--g)":"var(--r)";h+=`<div style="font-size:.78rem"><span style="color:var(--mt)">${cl[k]||k}:</span> <b style="color:${vc}">${v.rate}%</b> <span style="color:var(--mt);font-size:.7rem">(${v.success}/${v.total})</span></div>`}h+=`</div>`}
if(!d.mature)h+=`<div style="font-size:.68rem;color:var(--mt);margin-top:8px">⚠️ العينة ${d.closed}/20 — الدقة تتحسّن مع تراكم النتائج</div>`;
h+=`</div>`;c.innerHTML=h}catch(e){c.innerHTML=''}}
async function loadLongterm(){const box=document.getElementById("ltBox");if(!box)return;try{const d=await api("/api/recommendations/longterm");const picks=d.picks||[];if(!picks.length){box.innerHTML='';return}
let h=`<div class="sh"><div class="d" style="background:#9c6ade;box-shadow:0 0 14px #9c6ade"></div><h2>🌱 أسهم المدى البعيد النوعية</h2><span class="tg">${picks.length} · أسبوعي/شهري · لم ترتفع كثيراً</span></div>`;
h+=`<div style="font-size:.75rem;color:var(--mt);margin-bottom:8px">أسهم قوية على المدى الطويل، لم ترتفع كثيراً مؤخراً — فرص تجميع بعيدة المدى. قليلة ونادرة التغيّر.</div>`;
for(const p of picks){const cc=p.bet_score>=50?"var(--g)":"var(--ac2)";const wc=p.weekly_change>0?"var(--g)":p.weekly_change<0?"var(--r)":"var(--mt)";
h+=`<div class="rc" style="border-color:rgba(156,106,222,.3)">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center">
<div><b style="font-size:1.05rem">${p.name||''}</b> <span style="font-family:'IBM Plex Mono';color:var(--mt);font-size:.8rem">${p.symbol}</span></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span style="font-family:'IBM Plex Mono';font-weight:700">${p.price||''}</span>
<span style="font-size:.75rem;color:var(--mt)">إشارات طويلة ${p.long_pct}%</span>
<span style="background:${cc}22;color:${cc};padding:2px 8px;border-radius:6px;font-weight:700;font-size:.78rem">${(p.bet_score||0).toFixed(0)}</span></div></div>
<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.75rem">
<span style="color:${wc}">أسبوعي ${p.weekly_change>0?'+':''}${p.weekly_change}%</span>
<span style="color:var(--mt)">شهري ${p.monthly_change>0?'+':''}${p.monthly_change}%</span>
<span style="color:var(--ac2)">RSI ${(p.rsi||0).toFixed(0)} · ${p.rsi_state||''}</span>
${p.signals?.length?`<span style="color:var(--g)">🔑 ${p.signals.join(' · ')}</span>`:''}</div></div>`}
box.innerHTML=h}catch(e){box.innerHTML=''}}
async function loadLatest(){const box=document.getElementById("resultBox");if(!box)return;try{const d=await api("/api/recommendations/latest");const picks=d.picks||[];if(!picks.length)return;
let h=`<div class="sh"><div class="d" style="background:var(--o);box-shadow:0 0 14px var(--o)"></div><h2>🏆 آخر التوصيات الصادرة</h2><span class="tg">دفعة ${d.date||''} · ${picks.length} سهم</span></div>`;
h+=summaryTable(picks);
let rank=0;for(const p of picks){rank++;const cc=p.confidence>=9?"var(--g)":p.confidence>=7?"var(--ac2)":"var(--mt)";const cp=p.current_pct||0;const cpc=cp>0?"var(--g)":cp<0?"var(--r)":"var(--mt)";const bg=p.status==='active'?'':p.outcome==='success'?' <span style="color:var(--g)">✅ ناجحة</span>':p.outcome==='failed'?' <span style="color:var(--r)">❌ فاشلة</span>':p.outcome==='flat'?' <span style="color:var(--mt)">⚪</span>':'';const posW=Math.round((p.confidence||0)*10);const posLbl=p.confidence>=9?"إيجابية عالية جداً":p.confidence>=8?"إيجابية عالية":p.confidence>=7?"إيجابية جيدة":"إيجابية معتدلة";const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':`#${rank}`;
h+=`<div class="rc" id="card_${p.symbol}" style="border-color:rgba(255,152,0,.3)">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center">
<div><span style="font-size:1rem;margin-left:4px">${medal}</span><b style="font-size:1.12rem">${p.name||''}</b> <span style="font-family:'IBM Plex Mono';color:var(--mt);font-size:.82rem">${p.symbol}</span>${bg}</div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span style="font-size:.78rem;color:var(--mt)">دخول ${p.entry_price}</span>
${p.current_price?`<span style="font-size:.82rem">حالي <b>${p.current_price}</b> <span style="color:${cpc}">${cp>0?'+':''}${cp}%</span></span>`:''}
<span style="font-size:.78rem;color:var(--mt)">هدف ${p.target_price}</span>
<span style="background:${cc}22;color:${cc};padding:3px 10px;border-radius:8px;font-weight:800;font-size:.85rem">ثقة ${p.confidence}/10</span></div></div>
<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--mt);margin-bottom:3px"><span>درجة الإيجابية</span><span style="color:${cc};font-weight:700">${posLbl}</span></div><div class="sb"><div class="sf" style="width:${posW}%;background:linear-gradient(90deg,${cc},var(--g))"></div></div></div>
${p.reasoning?`<div style="margin-top:8px;font-size:.85rem;line-height:1.6">${p.reasoning}</div>`:''}</div>`}
h+=`<div style="font-size:.68rem;color:var(--mt);margin-top:10px;text-align:center">⚠️ تحليل فني مساعد وليس توصية مالية · اضغط "حلّل الآن" لتوصيات محدّثة</div>`;
box.innerHTML=h}catch(e){}}
async function loadTracking(){const b=document.getElementById("trackBox");b.innerHTML='<div style="color:var(--mt);font-size:.82rem"><span class="spin"></span> جاري التحميل...</div>';try{const d=await api("/api/recommendations/tracking");const c=d.counts||{};
// آخر تحديث
let lastUpd='';try{const sh=await api("/api/sync/history");const ls=sh.last_sync||{};if(ls.time)lastUpd=`آخر تحديث: ${ls.time.slice(0,16).replace('T',' ')} · ${ls.tab||''}`}catch(e){}
let h=`${lastUpd?`<div style="font-size:.75rem;color:var(--ac2);margin-bottom:8px">🕐 ${lastUpd}</div>`:''}
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
<span style="background:rgba(90,175,255,.12);color:#5aafff;padding:4px 12px;border-radius:8px;font-size:.82rem;font-weight:700">🔵 ${c.active||0} جارية</span>
<span style="background:rgba(0,230,118,.12);color:var(--g);padding:4px 12px;border-radius:8px;font-size:.82rem;font-weight:700">✅ ${c.success||0} ناجحة</span>
<span style="background:rgba(255,82,82,.12);color:var(--r);padding:4px 12px;border-radius:8px;font-size:.82rem;font-weight:700">❌ ${c.failed||0} فاشلة</span>
<span style="background:rgba(144,164,174,.12);color:var(--mt);padding:4px 12px;border-radius:8px;font-size:.82rem;font-weight:700">⚪ ${c.flat||0} بلا حركة</span>
${c.late>0?`<span style="background:rgba(0,212,255,.12);color:var(--ac2);padding:4px 12px;border-radius:8px;font-size:.82rem;font-weight:700">🔄 ${c.late} حققت لاحقاً</span>`:''}</div>`;
const active=(d.all||[]).filter(r=>r.status==='active');
const succ=(d.success||[]);
const others=(d.all||[]).filter(r=>r.status!=='active'&&r.outcome!=='success');
if(!active.length&&!succ.length&&!others.length){h+='<div style="color:var(--mt);font-size:.82rem;text-align:center;padding:15px">لا توجد توصيات محفوظة بعد — اضغط "حلّل الآن"</div>';b.innerHTML=h;return}
// جدول الجارية + غير الناجحة
const mainRows=active.concat(others);
if(mainRows.length){h+=trackTable(mainRows,false)}
// جدول الناجحة المستقل
if(succ.length){h+=`<div style="margin-top:16px;font-weight:700;color:var(--g);margin-bottom:6px">✅ حققت الهدف (${succ.length})</div>`;h+=trackTable(succ,true)}
b.innerHTML=h}catch(e){b.innerHTML=`<div style="color:var(--r);font-size:.82rem">❌ ${e.message}</div>`}}

function trackTable(rows,isSuccess){let h=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.8rem">
<thead><tr style="background:var(--bg);color:var(--ac2);font-size:.7rem"><th style="padding:7px 5px;text-align:right">السهم</th><th style="padding:7px 5px">تاريخ ووقت التوصية</th><th style="padding:7px 5px">الثقة</th><th style="padding:7px 5px">الحالة</th><th style="padding:7px 5px">الدخول</th><th style="padding:7px 5px">الحالي</th><th style="padding:7px 5px">الهدف</th><th style="padding:7px 5px">${isSuccess?'أعلى بعد الهدف':'أعلى'}</th><th style="padding:7px 5px">الذروة</th><th style="padding:7px 5px">ينتهي</th></tr></thead><tbody>`;
for(const r of rows){const pk=r.peak_pct||0;const pc=pk>=1.5?"var(--g)":pk<=-2?"var(--r)":"var(--mt)";const cp=r.current_pct||0;const cpc=cp>0?"var(--g)":cp<0?"var(--r)":"var(--mt)";const bg=r.status==='active'?'<span style="color:#5aafff">🔵</span>':r.outcome==='success'?'<span style="color:var(--g)">✅</span>':r.outcome==='flat'?'<span style="color:var(--mt)">⚪</span>':'<span style="color:var(--r)">❌</span>';const lt=r.post_watch_hit?' 🔄':'';
const dt=r.created_at?r.created_at.slice(0,16).replace('T',' '):(r.appeared_date||'');const cf=r.confidence||0;const cfc=cf>=9?"var(--g)":cf>=8?"var(--ac2)":"var(--mt)";
const highCol=isSuccess?(r.post_target_high?`${r.post_target_high} <span style="font-size:.65rem;color:var(--g)">+${(r.post_target_pct||0).toFixed(1)}%</span>`:(r.highest_price||'-')):(r.highest_price||'-');
h+=`<tr style="border-bottom:1px solid var(--ln2)${r.status==='active'?';background:rgba(90,175,255,.04)':isSuccess?';background:rgba(0,230,118,.04)':''}"><td style="padding:6px 5px"><b>${r.symbol}</b> <span style="color:var(--mt);font-size:.7rem">${r.name||''}</span>${lt}</td><td style="padding:6px 5px;text-align:center;font-size:.72rem;color:var(--mt);white-space:nowrap">${dt}</td><td style="padding:6px 5px;text-align:center"><span style="color:${cfc};font-weight:700">${cf}</span></td><td style="padding:6px 5px;text-align:center">${bg}</td><td style="padding:6px 5px;text-align:center">${r.entry_price||'-'}</td><td style="padding:6px 5px;text-align:center">${r.current_price?`<b>${r.current_price}</b> <span style="font-size:.65rem;color:${cpc}">${cp>0?'+':''}${cp}%</span>`:'<span style="color:var(--mt)">-</span>'}</td><td style="padding:6px 5px;text-align:center">${r.target_price||'-'}</td><td style="padding:6px 5px;text-align:center;${isSuccess?'color:var(--g);font-weight:700':''}">${highCol}</td><td style="padding:6px 5px;text-align:center;color:${pc};font-weight:700">${pk.toFixed(1)}%</td><td style="padding:6px 5px;text-align:center;font-size:.7rem;color:var(--mt);white-space:nowrap">${r.expiry_date||''}</td></tr>`}
return h+`</tbody></table></div>`}
async function updateTracking(){const b=document.getElementById("trackBox");b.innerHTML='<div style="color:var(--mt);font-size:.82rem"><span class="spin"></span> جاري تحديث الأسعار...</div>';try{const d=await api("/api/recommendations/update",{method:"POST"});const a=d.active||{};toast(`✅ نجاح:${a.success||0} فشل:${a.failed||0} جارية:${a.still_active||0} · المصدر: ${d.price_source||''}`);loadTracking()}catch(e){b.innerHTML=`<div style="color:var(--r);font-size:.82rem">❌ ${e.message}</div>`}}

async function runFull(){if(S.busy)return;S.busy=true;const btn=document.getElementById("mainBtn");btn.disabled=true;btn.innerHTML=`<span class="spin"></span> جاري التحليل والتقييم... (~20 ثانية)`;const box=document.getElementById("resultBox");box.innerHTML="";
try{const d=await api("/api/analyze-full",{method:"POST"});S.result=d;shell()}catch(e){box.innerHTML=`<div class="pn" style="color:var(--r)">❌ ${e.message}</div>`;btn.disabled=false;btn.innerHTML="🚀 حلّل الآن — Claude + Gemini"}S.busy=false}

function summaryTable(picks){let h=`<div class="pn" style="padding:0;overflow:hidden;margin-bottom:14px"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
<thead><tr style="background:var(--bg);color:var(--ac2);font-size:.72rem"><th style="padding:9px 6px">#</th><th style="padding:9px 6px;text-align:right">السهم</th><th style="padding:9px 6px">الثقة</th><th style="padding:9px 6px">الدخول</th><th style="padding:9px 6px">الحالي</th><th style="padding:9px 6px">الهدف</th><th style="padding:9px 6px">الأفق</th></tr></thead><tbody>`;
let rank=0;for(const p of picks){rank++;const cc=p.confidence>=9?"var(--g)":p.confidence>=7?"var(--ac2)":"var(--mt)";const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':`${rank}`;const cp=p.current_pct||0;const cpc=cp>0?"var(--g)":cp<0?"var(--r)":"var(--mt)";
h+=`<tr style="border-bottom:1px solid var(--ln2);cursor:pointer" onclick="document.getElementById('card_${p.symbol}')?.scrollIntoView({behavior:'smooth',block:'center'})">
<td style="padding:8px 6px;text-align:center">${medal}</td>
<td style="padding:8px 6px"><b>${p.name||''}</b> <span style="font-family:'IBM Plex Mono';color:var(--mt);font-size:.72rem">${p.symbol}</span></td>
<td style="padding:8px 6px;text-align:center"><span style="background:${cc}22;color:${cc};padding:2px 8px;border-radius:6px;font-weight:800">${p.confidence}</span></td>
<td style="padding:8px 6px;text-align:center">${p.entry_price||p.price||'-'}</td>
<td style="padding:8px 6px;text-align:center">${p.current_price?`${p.current_price} <span style="color:${cpc};font-size:.72rem">${cp>0?'+':''}${cp}%</span>`:'<span style="color:var(--mt)">-</span>'}</td>
<td style="padding:8px 6px;text-align:center">${p.target_price||'-'}</td>
<td style="padding:8px 6px;text-align:center;font-size:.75rem;color:var(--mt)">${p.horizon||p.category||'-'}</td></tr>`}
return h+`</tbody></table></div></div>`}

function renderResult(){const d=S.result;if(!d)return'';const md=d.market_mood||{};const mc=md.state==="صاعد"?"var(--g)":md.state==="هابط"?"var(--r)":"var(--ac2)";const picks=d.picks||[];
let h=`<div class="pn"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
<div><b style="color:var(--ac2)">السوق:</b> <span style="background:${mc}22;color:${mc};padding:4px 10px;border-radius:99px;font-size:.85rem;font-weight:700">${md.state||''}</span>
<span style="color:var(--mt);font-size:.8rem;margin-right:6px">${md.positive_count||0}↑ ${md.negative_count||0}↓ · ${d.total_stocks} سهم · ${d.tab||''}</span></div>
${d.saved?`<span style="color:var(--g);font-size:.8rem">💾 حُفظت ${d.saved}</span>`:''}</div>
${d.market_note?`<div style="font-size:.85rem;color:var(--ink);margin-top:8px">📊 ${d.market_note}</div>`:''}
${d.consensus_note?`<div style="font-size:.8rem;color:var(--ac2);margin-top:4px">🤝 ${d.consensus_note}</div>`:''}
${d.learn_note?`<div style="font-size:.8rem;color:var(--g);margin-top:4px;padding-top:4px;border-top:1px solid var(--ln2)">📚 تعلّم: ${d.learn_note}</div>`:''}
${d.movers_note?`<div style="font-size:.78rem;color:var(--ac2);margin-top:4px">🔍 ${d.movers_note}</div>`:''}
${d.missed_pattern&&d.missed_pattern!=='فراغ'?`<div style="font-size:.78rem;color:var(--o);margin-top:4px;background:rgba(255,152,0,.08);padding:6px 10px;border-radius:8px">💡 نمط الفرص الفائتة: ${d.missed_pattern}</div>`:''}
${(d.rejection_review&&d.rejection_review.length)?`<div style="margin-top:6px;font-size:.75rem"><div style="color:var(--mt);font-weight:700;margin-bottom:3px">🔍 مراجعة قرارات الرفض السابقة:</div>${d.rejection_review.map(r=>`<div style="color:${r.verdict.includes('خاطئ')?'var(--r)':r.verdict.includes('سليم')?'var(--g)':'var(--mt)'}">${r.symbol}: ${r.verdict} (${r.change_now>0?'+':''}${r.change_now}% الآن)</div>`).join('')}</div>`:''}</div>`;

h+=`<div class="sh"><div class="d" style="background:var(--o);box-shadow:0 0 14px var(--o)"></div><h2>🏆 التوصيات النهائية</h2><span class="tg">${picks.length} سهم · ${(d.models||[]).join(' + ')}</span></div>`;
picks.sort((a,b)=>(b.confidence||0)-(a.confidence||0));
if(!picks.length){h+=`<div class="pn" style="text-align:center;color:var(--mt);padding:25px">لم يتفق النموذجان على مرشح يستحق المراهنة في هذه اللقطة</div>`}
else{h+=summaryTable(picks)}
let rrank=0;for(const p of picks){rrank++;const cc=p.confidence>=9?"var(--g)":p.confidence>=7?"var(--ac2)":"var(--mt)";const chg=p.change_pct>0?"var(--g)":p.change_pct<0?"var(--r)":"var(--mt)";const posW=Math.round((p.confidence||0)*10);const posLbl=p.confidence>=9?"إيجابية عالية جداً":p.confidence>=8?"إيجابية عالية":p.confidence>=7?"إيجابية جيدة":"إيجابية معتدلة";const rmedal=rrank===1?'🥇':rrank===2?'🥈':rrank===3?'🥉':`#${rrank}`;
h+=`<div class="rc" id="card_${p.symbol}" style="border-color:rgba(255,152,0,.3)">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center">
<div><span style="font-size:1rem;margin-left:4px">${rmedal}</span><b style="font-size:1.12rem">${p.name||''}</b> <span style="font-family:'IBM Plex Mono';color:var(--mt);font-size:.82rem">${p.symbol}</span>
<span style="color:${chg};font-weight:700;font-size:.85rem">${p.change_pct>0?'+':''}${p.change_pct||0}%</span></div>
<div style="display:flex;gap:8px;align-items:center"><span style="font-family:'IBM Plex Mono';font-weight:700">${p.price||''}</span>
<span style="background:${cc}22;color:${cc};padding:4px 12px;border-radius:8px;font-weight:800">ثقة ${p.confidence}/10</span></div></div>
<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--mt);margin-bottom:3px"><span>درجة الإيجابية</span><span style="color:${cc};font-weight:700">${posLbl}</span></div><div class="sb"><div class="sf" style="width:${posW}%;background:linear-gradient(90deg,${cc},var(--g))"></div></div></div>
<div style="margin-top:8px;font-size:.88rem;line-height:1.7">${p.reasoning||''}</div>
<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
<div style="flex:1;min-width:180px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);border-radius:8px;padding:8px 10px">
<div style="font-size:.68rem;color:var(--g);font-weight:700;margin-bottom:2px">✓ سبب الترشيح</div>
<div style="font-size:.8rem">${p.key_signal||''}</div></div>
<div style="flex:1;min-width:180px;background:rgba(255,82,82,.07);border:1px solid rgba(255,82,82,.18);border-radius:8px;padding:8px 10px">
<div style="font-size:.68rem;color:var(--r);font-weight:700;margin-bottom:2px">⚠ نقطة الحذر</div>
<div style="font-size:.8rem">${p.risk||''}</div></div></div>
<div style="font-size:.72rem;color:var(--mt);margin-top:6px">⏱️ الأفق: ${p.horizon||''}</div></div>`}

const perf=d.performance;if(perf&&perf.closed>0){h+=`<div class="pn" style="margin-top:10px"><b style="color:var(--ac2)">📊 دقة النظام حتى الآن</b>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.85rem">
<span>نسبة النجاح: <b style="color:${perf.success_rate>=50?'var(--g)':'var(--r)'}">${perf.success_rate}%</b></span>
<span style="color:var(--g)">✅ ${perf.success}</span><span style="color:var(--r)">❌ ${perf.failed}</span>
<span style="color:#5aafff">🔵 ${perf.active} جارية</span>
${perf.late_success>0?`<span style="color:var(--ac2)">🔄 ${perf.late_success} حققت لاحقاً</span>`:''}</div>
${!perf.mature?`<div style="font-size:.72rem;color:var(--mt);margin-top:5px">⚠️ العينة ${perf.closed}/20 — الدقة تتحسّن مع تراكم النتائج</div>`:''}</div>`}

const rej=d.rejected||[];if(rej.length){h+=`<div style="margin-top:8px"><div style="font-size:.78rem;font-weight:700;color:var(--mt);margin-bottom:4px">🚫 مرفوضون:</div>`;for(const r of rej)h+=`<div style="font-size:.75rem;color:var(--mt);margin-bottom:2px"><b>${r.symbol}</b> — ${r.reason}</div>`;h+=`</div>`}
h+=`<div style="font-size:.68rem;color:var(--mt);margin-top:12px;text-align:center">⚠️ تحليل فني مساعد وليس توصية مالية</div>`;
return h}

async function loadSync(){try{const d=await api("/api/sync/status");const st=document.getElementById("syncStatus");const tm=document.getElementById("syncTimes");const pb=document.getElementById("pauseBtn");if(!st)return;if(tm)tm.textContent="· "+(d.schedule||[]).join(" · ")+" أيام التداول";if(pb){pb.innerHTML=d.paused?"▶️ استئناف":"⏸️ إيقاف مؤقت";pb.className=`bs${d.paused?' on':''}`}const ls=d.last_sync||{};let m=d.paused?'🔴 موقوف حتى إشعار آخر':d.scheduler_active?'🟢 نشط':'⚪ متوقف';if(ls.status==='success'){m+=` · آخر تحليل ${ls.tab||''} (${ls.stocks} سهم) ${ls.time?.slice(11,16)||''}`;const lg=(d.log||[]).slice(-1)[0];if(lg&&lg.saved!==undefined)m+=` · 🏆 ${lg.picks_count||0} توصية`}else if(ls.status==='no_update')m+=` · ⚠️ آخر تحديث لا يزال ساري — التحليل متوقف`;else if(ls.status==='error')m+=` · ❌ ${ls.error||''}`;if(!d.paused)m+=` · القادم: ${d.next_sync||''}`;st.innerHTML=m}catch(e){}}
async function togglePause(){try{const d=await api("/api/sync/status");if(d.paused)await api("/api/sync/resume",{method:"POST"});else await api("/api/sync/pause",{method:"POST"});loadSync()}catch(e){toast("❌ "+e.message)}}

<div class="pn"><div style="font-weight:700;color:var(--ac2);margin-bottom:8px">ℹ️ ساعات السوق</div>
<div style="font-size:.82rem;color:var(--mt);line-height:1.8">أحد–خميس · 9:30ص–3:20م · الجمعة والسبت عطلة</div></div>`}

let CFG_TIMES=[];
async function loadCfg(){try{const c=await api("/api/config");const f=(i,v)=>{const e=document.getElementById(i);if(e)e.value=v||""};f("cs",c.sheet_url);f("ck",c.claude_key);f("cg",c.gemini_key);f("csh",c.sahmk_api_key);f("su",c.supabase_url);f("sk",c.supabase_key)}catch(e){}try{const d=await api("/api/sync/status");CFG_TIMES=d.schedule||[];renderTimes()}catch(e){}}
function renderTimes(){const el=document.getElementById("timesList");if(!el)return;el.innerHTML=CFG_TIMES.map((t,i)=>`<span style="background:var(--p2);border:1px solid var(--ln);padding:5px 10px;border-radius:8px;font-size:.85rem">${t} <span onclick="rmTime(${i})" style="cursor:pointer;color:var(--r);margin-right:4px">✕</span></span>`).join('')}
function addTime(){const t=document.getElementById("newTime").value;if(t&&!CFG_TIMES.includes(t)){CFG_TIMES.push(t);CFG_TIMES.sort();renderTimes()}}
function rmTime(i){CFG_TIMES.splice(i,1);renderTimes()}
async function saveTimes(){const m=document.getElementById("tmsg");m.textContent="⏳";try{await api("/api/sync/times",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(CFG_TIMES)});m.innerHTML='<span style="color:var(--g)">✅ حُفظت</span>'}catch(e){m.innerHTML=`<span style="color:var(--r)">❌ ${e.message}</span>`}}
async function saveCfg(){const m=document.getElementById("cm");m.textContent="⏳";try{await api("/api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sheet_url:v("cs"),claude_key:v("ck"),gemini_key:v("cg"),sahmk_api_key:v("csh"),supabase_url:v("su"),supabase_key:v("sk")})});m.innerHTML='<span style="color:var(--g)">✅ تم</span>'}catch(e){m.innerHTML=`<span style="color:var(--r)">❌ ${e.message}</span>`}}
function v(i){return document.getElementById(i)?.value||""}
async function setupTb(){const m=document.getElementById("cm");m.textContent="⏳";try{const r=await api("/api/setup/tables",{method:"POST"});m.innerHTML=r.sql?'<span style="color:var(--o)">⚠️ أنشئ يدوياً من SQL Editor</span>':`<span style="color:var(--g)">✅ ${r.message}</span>`}catch(e){m.innerHTML=`<span style="color:var(--r)">❌ ${e.message}</span>`}}
async function testKeys(){const b=document.getElementById("keyTest");b.innerHTML='<div style="color:var(--mt);font-size:.85rem"><span class="spin"></span> جاري اختبار المفاتيح...</div>';try{const d=await api("/api/test/keys");const names={sahmk:"📊 سهمك",claude:"🔑 Claude",gemini:"✨ Gemini",supabase:"🗄️ Supabase",sheet:"📋 Google Sheets"};let h='';for(const[k,v]of Object.entries(d)){const c=v.ok?"var(--g)":"var(--r)";const ic=v.ok?"✅":"❌";h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg2);border:1px solid ${v.ok?'rgba(0,230,118,.2)':'rgba(255,82,82,.2)'};border-radius:8px;margin-bottom:6px"><span style="font-weight:700">${names[k]||k}</span><span style="color:${c};font-size:.82rem">${ic} ${v.msg}</span></div>`}b.innerHTML=h}catch(e){b.innerHTML=`<div style="color:var(--r);font-size:.85rem">❌ ${e.message}</div>`}}
